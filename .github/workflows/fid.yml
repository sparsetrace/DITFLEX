name: fidXX

# Manual FID-50k evaluation of one or more DAC/SiT arms.
# The arms are evaluated SEQUENTIALLY on one Modal GPU so peak GPU usage stays low.
# Default model specs:
#   official-sit                                  official Xie et al. SiT-XL/2
#   jcandane/AMAP@latest                          newest AMAP checkpoints/step_*
#   jcandane/DMAP@checkpoints/step_0080000        pinned DMAP 80k checkpoint
#
# Paper recommendation:
#   N=50,000, identical sampler/CFG/seed, EMA weights, and the same reference stats.
#   bootstrap_reps=100 is a reasonable final run; use 5-10 only for a smoke test.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated arms; evaluated sequentially on one GPU"
        required: false
        default: "jcandane/AMAP@latest,jcandane/DMAP@checkpoints/step_0080000"
      gpu:
        description: "Modal GPU. H100 recommended for the final 50k three-arm evaluation."
        required: false
        default: "H100"
      num_samples:
        description: "Samples per arm (50000 = paper FID-50k; 1000 = smoke test)"
        required: false
        default: "50000"
      batch_size:
        description: "Sampling batch size. 64 is the H100 default; reduce to 32 if a checkpoint OOMs."
        required: false
        default: "64"
      sample_steps:
        description: "Euler/ODE steps; held identical across all arms"
        required: false
        default: "50"
      cfg_scale:
        description: "Classifier-free guidance scale; held identical across all arms"
        required: false
        default: "1.5"
      bootstrap_reps:
        description: "Bootstrap replicates for FID uncertainty (100 final; 5-10 smoke test; 0 disables)"
        required: false
        default: "100"
      inference_precision:
        description: "Generative-model inference precision: bf16 (recommended on H100), fp16, or fp32"
        required: false
        default: "bf16"
      ref_stats_url:
        description: "Precomputed ImageNet-256 reference .npz (mu/sigma). Preferred for headline FID."
        required: false
        default: ""
      ref_mode:
        description: "Fallback if ref_stats_url is empty: latents"
        required: false
        default: "latents"
      latents_repo:
        description: "HF dataset repo with SD-VAE latents; required for ref_mode=latents"
        required: false
        default: "sparsetrace/dlatentzz"
      objective:
        description: "flow for SiT/AMAP/DMAP"
        required: false
        default: "flow"
      seed:
        description: "Base seed; kept fixed across arms"
        required: false
        default: "0"
      fid_seconds:
        description: "Modal timeout seconds for the sequential three-arm H100 run."
        required: false
        default: "28800"

permissions:
  contents: write

jobs:
  fid:
    name: "fid · N=${{ inputs.num_samples }} · ${{ inputs.gpu }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: |
          pip install 'modal<1.5' huggingface_hub
          modal --version

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.ref_stats_url }}" ] && \
             [ "${{ inputs.ref_mode }}" = "latents" ] && \
             [ -z "${{ inputs.latents_repo }}" ]; then
            echo "::error::ref_mode=latents requires latents_repo."
            exit 1
          fi
          if [ $(( ${{ inputs.num_samples }} % 1000 )) -ne 0 ]; then
            echo "::warning::num_samples is not a multiple of 1000; ImageNet classes cannot be exactly balanced."
          fi
          if [ "${{ inputs.bootstrap_reps }}" -lt 20 ]; then
            echo "::warning::bootstrap_reps < 20 is suitable only for pipeline testing, not paper uncertainty."
          fi

      - name: Modal import preflight
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODAL_GPU: ${{ inputs.gpu }}
          MODAL_FID_SECONDS: ${{ inputs.fid_seconds }}
        run: |
          python -m py_compile evaluation/modal_fidXX.py
          modal run evaluation/modal_fidXX.py --help

      - name: Compute FID on Modal
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODAL_GPU: ${{ inputs.gpu }}
          MODAL_FID_SECONDS: ${{ inputs.fid_seconds }}
        run: |
          echo "gpu=${MODAL_GPU} N=${{ inputs.num_samples }} cfg=${{ inputs.cfg_scale }} bootstrap=${{ inputs.bootstrap_reps }} precision=${{ inputs.inference_precision }}"
          modal run evaluation/modal_fidXX.py \
            --repos "${{ inputs.repos }}" \
            --num-samples "${{ inputs.num_samples }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --sample-steps "${{ inputs.sample_steps }}" \
            --cfg-scale "${{ inputs.cfg_scale }}" \
            --bootstrap-reps "${{ inputs.bootstrap_reps }}" \
            --inference-precision "${{ inputs.inference_precision }}" \
            --ref-stats-url "${{ inputs.ref_stats_url }}" \
            --ref-mode "${{ inputs.ref_mode }}" \
            --objective "${{ inputs.objective }}" \
            --latents-repo "${{ inputs.latents_repo }}" \
            --seed "${{ inputs.seed }}"

      - name: Show results
        run: cat evaluation/fidXX_results.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluation/fidXX_results.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fid: N=${{ inputs.num_samples }} cfg=${{ inputs.cfg_scale }} bootstrap=${{ inputs.bootstrap_reps }} [skip ci]"
          git push
