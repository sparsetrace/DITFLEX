name: AMAP

# Manual only. Loads the 7M SiT-XL/2, applies AMAP (coupled), and either
# smoke-tests it or runs a short flow-matching finetune on your HF latents,
# all on a Modal B200. The long transactional finetune stays in train.yml.
on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "Modal GPU"
        type: choice
        options: [B200, H200, H100, A100-80GB]
        default: B200
      stage:
        description: "smoke (load+patch+forward) or finetune"
        type: choice
        options: [smoke, finetune]
        default: smoke
      steps:
        description: "finetune steps"
        type: string
        default: "500"
      lr:
        description: "finetune LR"
        type: string
        default: "0.00001"
      latents_repo:
        description: "your HF latents dataset (required for finetune)"
        type: string
        default: "sparsetrace/dlatentzz"
      push_repo:
        description: "HF repo to push the AMAP checkpoint to (finetune only)"
        type: string
        default: "sparsetrace/AMAP"
      qk_rmsnorm:
        description: "per-head RMSNorm on q,k (stabiliser, off by default)"
        type: boolean
        default: false
      learn_logit_scale:
        description: "per-head learnable logit scale (stabiliser, off by default)"
        type: boolean
        default: false

jobs:
  amap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - name: modal run AMAP
        working-directory: AMAP
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          AMAP_GPU: ${{ inputs.gpu }}
        run: |
          modal run AMAP.py \
            --stage "${{ inputs.stage }}" \
            --steps "${{ inputs.steps }}" \
            --lr "${{ inputs.lr }}" \
            --latents-repo "${{ inputs.latents_repo }}" \
            --push-repo "${{ inputs.push_repo }}" \
            ${{ inputs.qk_rmsnorm == 'true' && '--qk-rmsnorm' || '--no-qk-rmsnorm' }} \
            ${{ inputs.learn_logit_scale == 'true' && '--learn-logit-scale' || '--no-learn-logit-scale' }}
